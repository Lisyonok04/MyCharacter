name: mycharacter

services:
  db:
    image: postgres:18
    container_name: mycharacter-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-mycharacter}
    ports:
      - "${DB_EXTERNAL_PORT:-15432}:5432"
    volumes:
      - db:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Веб-интерфейс к БД: docker compose --profile tools up -d  ->  http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: mc-adminer
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mycharacter-backend
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mycharacter}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  db: